# Jenkins + SonarQube host created by terraform/ci. No SSH: Ansible connects through SSM Session Manager.
# Fill the two values from `terraform -chdir=terraform/ci output`:
#   instance_id -> ansible_host,  ssm_bucket -> ansible_aws_ssm_bucket_name
# Control node needs: the AWS session-manager-plugin, boto3/botocore, and admin AWS credentials.
#   ansible-playbook -i inventories/ci/hosts.yml playbooks/jenkins.yml
all:
  vars:
    env: ci
    ansible_connection: community.aws.aws_ssm
    ansible_aws_ssm_region: ap-south-1
    ansible_aws_ssm_bucket_name: shopverse-ci-ssm-786896018375   # tf-output: ssm_bucket
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
  children:
    jenkins:
      hosts:
        jenkins-ci:
          ansible_host: i-0123456789abcdef0                       # tf-output: instance_id
    monitored:
      children:
        jenkins:
