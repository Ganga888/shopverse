# Example dev inventory. Hosts are reached over SSH through the bastion
# (or replace ansible_host with the instance id and use the SSM connection
# plugin: ansible_connection=community.aws.aws_ssm).
all:
  vars:
    env: dev
  children:
    bastion:
      hosts:
        bastion-dev:
          ansible_host: 203.0.113.10
    jenkins:
      hosts:
        jenkins-dev:
          ansible_host: 10.10.96.20
          ansible_ssh_common_args: "-o ProxyJump=ubuntu@203.0.113.10"
    monitored:
      children:
        bastion:
        jenkins:
