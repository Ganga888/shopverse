# Example prod inventory (SSM Session Manager, no inbound SSH needed).
all:
  vars:
    env: prod
    ansible_connection: community.aws.aws_ssm
    ansible_aws_ssm_region: ap-south-1
    ansible_aws_ssm_bucket_name: shopverse-prod-logs   # SSM file transfer bucket
  children:
    jenkins:
      hosts:
        jenkins-prod:
          ansible_host: i-0123456789abcdef0
    monitored:
      children:
        jenkins:
