docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_users: []
docker_log_max_size: 20m
docker_log_max_file: "5"
docker_data_root: /var/lib/docker
# Address pools that do not overlap the shopverse VPCs (10.10/10.20/10.30)
docker_default_address_pools:
  - base: 172.20.0.0/14
    size: 24
