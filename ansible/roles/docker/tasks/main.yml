- name: Remove conflicting distro packages
  ansible.builtin.apt:
    name: [docker.io, docker-doc, docker-compose, podman-docker, containerd, runc]
    state: absent

- name: Keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Docker daemon configuration
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  vars:
    docker_daemon_config:
      data-root: "{{ docker_data_root }}"
      log-driver: json-file
      log-opts:
        max-size: "{{ docker_log_max_size }}"
        max-file: "{{ docker_log_max_file }}"
      live-restore: true
      userland-proxy: false
      no-new-privileges: true
      default-address-pools: "{{ docker_default_address_pools }}"
      features:
        buildkit: true
  notify: Restart docker

- name: IP forwarding required by Docker networking
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_file: /etc/sysctl.d/60-shopverse-hardening.conf
    reload: true

- name: Docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Docker group membership
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Weekly prune of unused images/build cache
  ansible.builtin.cron:
    name: docker-prune
    cron_file: docker-prune
    user: root
    special_time: weekly
    job: "/usr/bin/docker system prune -af --filter until=168h >/var/log/docker-prune.log 2>&1"
