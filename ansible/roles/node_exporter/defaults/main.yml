node_exporter_version: "1.8.2"
node_exporter_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
node_exporter_listen: "0.0.0.0:9100"
node_exporter_port: 9100
node_exporter_allowed_cidrs: ["10.0.0.0/8"]
node_exporter_textfile_dir: /var/lib/node_exporter/textfile
node_exporter_collectors_enabled: [systemd, processes, tcpstat]
node_exporter_collectors_disabled: [mdadm, infiniband, nfs, nfsd, xfs, zfs]
