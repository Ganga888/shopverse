- name: node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: node_exporter
    group: node_exporter
    mode: "0755"

- name: Check installed version
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false

- name: Install node_exporter {{ node_exporter_version }}
  when: node_exporter_version not in (node_exporter_installed.stderr | default('') + node_exporter_installed.stdout | default(''))
  block:
    - name: Download release checksums
      ansible.builtin.uri:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/sha256sums.txt"
        return_content: true
      register: node_exporter_sums
      check_mode: false

    - name: Download tarball (checksum verified)
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ _tarball }}"
        dest: "/tmp/{{ _tarball }}"
        checksum: "sha256:{{ (node_exporter_sums.content.splitlines() | select('search', _tarball) | first).split()[0] }}"
        mode: "0644"

    - name: Unpack
      ansible.builtin.unarchive:
        src: "/tmp/{{ _tarball }}"
        dest: /tmp
        remote_src: true

    - name: Install binary
      ansible.builtin.copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart node_exporter
  vars:
    _tarball: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"

- name: systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: node_exporter enabled
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Firewall - allow scrapes from monitoring CIDRs only
  community.general.ufw:
    rule: allow
    port: "{{ node_exporter_port }}"
    proto: tcp
    src: "{{ item }}"
    comment: node_exporter
  loop: "{{ node_exporter_allowed_cidrs }}"

- name: Verify metrics endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
    status_code: 200
  register: node_exporter_check
  retries: 5
  delay: 3
  until: node_exporter_check.status == 200
  changed_when: false
