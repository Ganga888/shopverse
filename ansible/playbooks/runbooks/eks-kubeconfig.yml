# Configure kubectl for a ShopVerse cluster and verify access.
#   ansible-playbook playbooks/runbooks/eks-kubeconfig.yml -e env=staging [-e assume_role_arn=arn:aws:iam::...:role/admin]
- name: EKS kubeconfig
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    env: dev
    aws_region: ap-south-1
    cluster_name: "shopverse-{{ env }}"
    kubeconfig_path: "{{ lookup('env', 'KUBECONFIG') | default('~/.kube/config', true) }}"
    assume_role_arn: ""
  tasks:
    - name: Validate env
      ansible.builtin.assert:
        that: env in ['dev', 'staging', 'prod']

    - name: Current AWS identity
      amazon.aws.aws_caller_info:
      register: caller

    - name: Show identity
      ansible.builtin.debug:
        msg: "Using {{ caller.arn }} in account {{ caller.account }}"

    - name: Cluster status
      ansible.builtin.command: >-
        aws eks describe-cluster --name {{ cluster_name }} --region {{ aws_region }}
        --query cluster.status --output text
      register: cluster_status
      changed_when: false
      failed_when: cluster_status.rc != 0 or cluster_status.stdout != 'ACTIVE'

    - name: Update kubeconfig
      ansible.builtin.command: >-
        aws eks update-kubeconfig --name {{ cluster_name }} --region {{ aws_region }}
        --alias {{ cluster_name }} --kubeconfig {{ kubeconfig_path }}
        {{ ('--role-arn ' ~ assume_role_arn) if assume_role_arn | length > 0 else '' }}
      register: kubeconfig
      changed_when: "'Added new context' in kubeconfig.stdout or 'Updated context' in kubeconfig.stdout"

    - name: Verify API access (nodes)
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ kubeconfig_path }}"
        context: "{{ cluster_name }}"
      register: nodes

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "context: {{ cluster_name }}"
          - "nodes: {{ nodes.resources | length }} ({{ nodes.resources | map(attribute='metadata.name') | join(', ') }})"
          - "Note: access is granted by EKS access entries (terraform var cluster_admin_role_arns / cluster_view_role_arns)."
