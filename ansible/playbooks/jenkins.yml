# Jenkins controller: Docker + the compose stack from ci/jenkins/docker-compose.yml.
#   ansible-playbook -i inventories/ci/hosts.yml playbooks/jenkins.yml   (EC2 host from terraform/ci, over SSM)
- name: Jenkins host
  hosts: jenkins
  become: true
  vars:
    common_ip_forward: 1
    docker_users: ["{{ ansible_user }}"]
    cloudwatch_agent_extra_logs:
      - { file: "/var/lib/docker/containers/*/*-json.log", group: jenkins-containers }
  roles:
    - role: common
      tags: [common]
    - role: docker
      tags: [docker]
    - role: jenkins_host
      tags: [jenkins]
    - role: node_exporter
      tags: [node_exporter]
    - role: cloudwatch_agent
      tags: [cloudwatch_agent]
