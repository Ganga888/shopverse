# Baseline: users, SSH, unattended upgrades, auditd, fail2ban, chrony, sysctl,
# host firewall, node_exporter and the CloudWatch agent.
- name: Harden hosts
  hosts: all
  become: true
  vars:
    # Container hosts need forwarding (Docker bridge networking).
    common_ip_forward: "{{ 1 if 'jenkins' in group_names else 0 }}"
  roles:
    - role: common
      tags: [common]
    - role: node_exporter
      tags: [node_exporter]
      when: "'monitored' in group_names"
    - role: cloudwatch_agent
      tags: [cloudwatch_agent]
