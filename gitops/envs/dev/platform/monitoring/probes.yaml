# Synthetic probes through the public path (Route 53 -> CloudFront/ALB -> WAF -> nginx). Feed the
# EndpointProbeFailing and TLSCertificateExpiry* alerts (observability/prometheus-rules/certificates.yaml).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: public-endpoints
  namespace: monitoring
spec:
  jobName: blackbox
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        env: dev
      static:
          - https://dev.ganga888.in/
          - https://api.dev.ganga888.in/api/v1/products
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: ops-tools
  namespace: monitoring
spec:
  jobName: blackbox
  interval: 120s
  module: http_2xx_or_auth
  prober:
    url: blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      labels:
        env: dev
      static:
          - https://argocd.dev.ganga888.in/healthz
          - https://grafana.dev.ganga888.in/api/health
          - https://kibana.dev.ganga888.in/api/status
          - https://jaeger.dev.ganga888.in/
