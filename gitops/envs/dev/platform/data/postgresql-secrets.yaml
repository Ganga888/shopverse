# dev in-cluster PostgreSQL credentials.
# - postgres superuser: random, in-cluster only (ESO Password generator).
# - one role per service: the SAME shopverse/dev/rds/<service> secrets the services read, so the
#   service pods and the database agree without any credential living in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-auth
  namespace: data
spec:
  refreshInterval: "0"
  target:
    name: postgresql-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: random-password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-service-users
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: postgresql-service-users
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/auth-service, property: username }
    - secretKey: AUTH_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/auth-service, property: password }
    - secretKey: USER_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/user-service, property: username }
    - secretKey: USER_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/user-service, property: password }
    - secretKey: CATALOG_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/catalog-service, property: username }
    - secretKey: CATALOG_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/catalog-service, property: password }
    - secretKey: SEARCH_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/search-service, property: username }
    - secretKey: SEARCH_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/search-service, property: password }
    - secretKey: INVENTORY_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/inventory-service, property: username }
    - secretKey: INVENTORY_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/inventory-service, property: password }
    - secretKey: ORDER_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/order-service, property: username }
    - secretKey: ORDER_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/order-service, property: password }
    - secretKey: PAYMENT_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/payment-service, property: username }
    - secretKey: PAYMENT_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/payment-service, property: password }
    - secretKey: SHIPPING_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/shipping-service, property: username }
    - secretKey: SHIPPING_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/shipping-service, property: password }
    - secretKey: REVIEW_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/review-service, property: username }
    - secretKey: REVIEW_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/review-service, property: password }
    - secretKey: PROMOTION_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/promotion-service, property: username }
    - secretKey: PROMOTION_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/promotion-service, property: password }
    - secretKey: AUDIT_SERVICE_USER
      remoteRef: { key: shopverse/dev/rds/audit-service, property: username }
    - secretKey: AUDIT_SERVICE_PASSWORD
      remoteRef: { key: shopverse/dev/rds/audit-service, property: password }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-initdb
  namespace: data
data:
  10-create-service-databases.sh: |
    #!/bin/bash
    # Runs once on first initialisation of the data volume (bitnami initdb hook).
    set -euo pipefail
    if [[ -n "${POSTGRES_POSTGRES_PASSWORD_FILE:-}" ]]; then
      export PGPASSWORD="$(cat "$POSTGRES_POSTGRES_PASSWORD_FILE")"
    elif [[ -n "${POSTGRES_PASSWORD_FILE:-}" ]]; then
      export PGPASSWORD="$(cat "$POSTGRES_PASSWORD_FILE")"
    else
      export PGPASSWORD="${POSTGRES_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-}}"
    fi
    PSQL="psql -v ON_ERROR_STOP=1 --username postgres --dbname postgres"   # local socket during initdb
    for pair in AUTH_SERVICE:auth USER_SERVICE:users CATALOG_SERVICE:catalog SEARCH_SERVICE:search INVENTORY_SERVICE:inventory ORDER_SERVICE:orders PAYMENT_SERVICE:payments SHIPPING_SERVICE:shipping REVIEW_SERVICE:reviews PROMOTION_SERVICE:promotions AUDIT_SERVICE:audit; do
      prefix="${pair%%:*}"; db="${pair##*:}"
      user_var="${prefix}_USER"; pass_var="${prefix}_PASSWORD"
      user="${!user_var}"; pass="${!pass_var}"
      echo "creating role ${user} and database ${db}"
      $PSQL <<SQL
    DO \$\$BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '${user}') THEN
        CREATE ROLE "${user}" LOGIN PASSWORD '${pass}';
      ELSE
        ALTER ROLE "${user}" WITH LOGIN PASSWORD '${pass}';
      END IF;
    END\$\$;
    SQL
      if ! $PSQL -tAc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1; then
        $PSQL -c "CREATE DATABASE \"${db}\" OWNER \"${user}\""
      fi
      $PSQL -c "REVOKE ALL ON DATABASE \"${db}\" FROM PUBLIC"
    done
