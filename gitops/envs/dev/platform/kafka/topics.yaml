# Contract topics (dev: 3 partitions, RF 1) + <topic>.dlq dead-letter topics.
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: users-events
  namespace: kafka
  labels:
    strimzi.io/cluster: shopverse-kafka
    shopverse.io/topic-type: main
spec:
  topicName: users.events
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
    min.insync.replicas: 1
