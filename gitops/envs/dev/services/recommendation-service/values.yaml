# recommendation-service (dev) - values for charts/microservice. Release name == recommendation-service, namespace shop.
# image.tag is bumped by Jenkins (ci/Jenkinsfile) after every main-branch build.
# Datastores, topics, secrets and IRSA follow docs/CONTRACT.md - keep them in sync with the contract.
global:
  env: dev
  domain: dev.ganga888.in
  awsAccountId: '786896018375'
  awsRegion: ap-south-1
image:
  repository: 786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/recommendation-service
  tag: bootstrap
replicaCount: 2
logLevel: debug
nodeEnv: production
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
ingress:
  enabled: true
  path: /api/v1/recommendations
serviceAccount:
  irsa:
    enabled: false
env:
  NODE_OPTIONS: --max-old-space-size=192
  REDIS_URL: redis://redis-master.data.svc.cluster.local:6379/0
  KAFKA_BROKERS: shopverse-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  KAFKA_SSL: 'false'
  KAFKA_CLIENT_ID: recommendation-service
  KAFKA_GROUP_ID: recommendation-service
externalSecrets:
  enabled: false
  items: []
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpread:
  zoneWhenUnsatisfiable: ScheduleAnyway
prometheusRule:
  severity: warning
networkPolicy:
  callers: []
  egressToServices:
  - catalog-service
  egress:
    postgres: false
    redis: true
    kafka: true
  datastorePeers:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: data
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kafka
