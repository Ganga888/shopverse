# promotion-service (dev) - values for charts/microservice. Release name == promotion-service, namespace shop.
# image.tag is bumped by Jenkins (ci/Jenkinsfile) after every main-branch build.
# Datastores, topics, secrets and IRSA follow docs/CONTRACT.md - keep them in sync with the contract.
global:
  env: dev
  domain: dev.ganga888.in
  awsAccountId: '111122223333'
  awsRegion: ap-south-1
image:
  repository: 111122223333.dkr.ecr.ap-south-1.amazonaws.com/shopverse/promotion-service
  tag: bootstrap
replicaCount: 2
logLevel: debug
nodeEnv: production
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
ingress:
  enabled: true
  path: /api/v1/promotions
serviceAccount:
  irsa:
    enabled: false
env:
  NODE_OPTIONS: --max-old-space-size=192
  DB_HOST: postgresql.data.svc.cluster.local
  DB_PORT: '5432'
  DB_NAME: promotions
  DB_SSL: 'false'
externalSecrets:
  items:
  - name: db
    remoteKey: shopverse/dev/rds/promotion-service
    keys:
      DB_USER: username
      DB_PASSWORD: password
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpread:
  zoneWhenUnsatisfiable: ScheduleAnyway
prometheusRule:
  severity: warning
networkPolicy:
  callers:
  - cart-service
  - order-service
  egressToServices: []
  egress:
    postgres: true
    redis: false
    kafka: false
  datastorePeers:
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: data
  - namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kafka
migration:
  enabled: true
