apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluent-bit
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://fluent.github.io/helm-charts
    chart: fluent-bit
    targetRevision: 0.48.9
    helm:
      releaseName: fluent-bit
      valuesObject:
        kind: DaemonSet
        serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
        tolerations:
          - operator: Exists                 # every node, including tainted system nodes
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
        env:
          - name: ES_PASSWORD
            valueFrom: { secretKeyRef: { name: es-user-fluentbit, key: password } }
          - name: CLUSTER_ENV
            value: staging
        extraVolumes:
          - name: es-ca
            secret: { secretName: shopverse-es-http-certs-public }
        extraVolumeMounts:
          - { name: es-ca, mountPath: /fluent-bit/tls, readOnly: true }
        # Parsers mirror observability/fluent-bit/parsers.conf (source of truth).
        config:
          service: |
            [SERVICE]
                Daemon Off
                Flush 2
                Log_Level info
                Parsers_File /fluent-bit/etc/parsers.conf
                Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
                HTTP_Server On
                HTTP_Listen 0.0.0.0
                HTTP_Port 2020
                Health_Check On
                storage.path /var/fluent-bit/state/flb-storage/
                storage.sync normal
                storage.backlog.mem_limit 16M
          inputs: |
            [INPUT]
                Name tail
                Tag kube.*
                Path /var/log/containers/*.log
                Exclude_Path /var/log/containers/fluent-bit-*.log
                multiline.parser cri, docker
                DB /var/fluent-bit/state/flb_kube.db
                Mem_Buf_Limit 32MB
                Skip_Long_Lines On
                Refresh_Interval 10
                storage.type filesystem
          filters: |
            [FILTER]
                Name kubernetes
                Match kube.*
                Merge_Log On
                Merge_Log_Key app
                Keep_Log Off
                K8S-Logging.Parser On
                K8S-Logging.Exclude On
                Labels On
                Annotations Off
                Buffer_Size 0
            [FILTER]
                Name lua
                Match kube.*
                script /fluent-bit/scripts/shopverse.lua
                call lift_app_fields
            [FILTER]
                Name modify
                Match kube.*
                Add env ${CLUSTER_ENV}
                Add cluster shopverse-${CLUSTER_ENV}
          outputs: |
            [OUTPUT]
                Name es
                Match kube.*
                Host shopverse-es-http.logging.svc
                Port 9200
                tls On
                tls.verify On
                tls.ca_file /fluent-bit/tls/ca.crt
                HTTP_User fluentbit
                HTTP_Passwd ${ES_PASSWORD}
                Logstash_Format On
                Logstash_Prefix logs-k8s
                Logstash_DateFormat %Y.%m.%d
                Replace_Dots On
                Suppress_Type_Name On
                Generate_ID On
                Trace_Error On
                Retry_Limit 10
                storage.total_limit_size 1G
          customParsers: |
            [PARSER]
                Name        shopverse_json
                Format      json
                Time_Key    time
                Time_Format %Y-%m-%dT%H:%M:%S.%L%z
                Time_Keep   On
            [PARSER]
                Name        pino_json
                Format      json
                Time_Key    time
                Time_Format %s%L
                Time_Keep   On
            [PARSER]
                Name        nginx_json
                Format      json
                Time_Key    time
                Time_Format %Y-%m-%dT%H:%M:%S%z
                Time_Keep   On
            [PARSER]
                Name        klog
                Format      regex
                Regex       ^(?<level>[IWEF])(?<time>\d{4} \d{2}:\d{2}:\d{2}\.\d{6})\s+(?<pid>\d+)\s+(?<source>[^\]]+)\]\s+(?<message>.*)$
                Time_Key    time
                Time_Format %m%d %H:%M:%S.%L
                Time_Keep   On
        luaScripts:
          shopverse.lua: |
            -- Lift pino fields (level, msg, trace_id, span_id, correlationId) to top level for ES/Kibana.
            local LEVELS = { [10]="trace", [20]="debug", [30]="info", [40]="warn", [50]="error", [60]="fatal" }
            function lift_app_fields(tag, ts, record)
              local app = record["app"]
              if type(app) ~= "table" then return 0, ts, record end
              for _, k in ipairs({"trace_id", "span_id", "correlationId", "msg", "service", "req_id"}) do
                if app[k] ~= nil then record[k] = app[k] end
              end
              if app["msg"] ~= nil then record["message"] = app["msg"] end
              local lvl = app["level"]
              if type(lvl) == "number" then record["level"] = LEVELS[lvl] or tostring(lvl)
              elseif lvl ~= nil then record["level"] = lvl end
              return 2, ts, record
            end
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
