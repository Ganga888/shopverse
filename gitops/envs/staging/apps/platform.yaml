apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator
    targetRevision: 2.16.1
    helm:
      releaseName: eck-operator
      valuesObject:
        installCRDs: true
        managedNamespaces: [logging]
        config:
          metrics: { port: 9090 }
        podMonitor: { enabled: true, labels: { release: kube-prometheus-stack } }
        resources: { requests: { cpu: 100m, memory: 150Mi }, limits: { memory: 512Mi } }
  destination:
    server: https://kubernetes.default.svc
