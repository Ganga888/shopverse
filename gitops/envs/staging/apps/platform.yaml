            enabled: true
            serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
        resources:
          operator: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
          metricServer: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
