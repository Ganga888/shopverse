# ArgoCD Applications for the staging platform layer. Synced by gitops/bootstrap/staging-root.yaml.
# Sync waves (Application health gates the next wave; see argocd values resource.customizations):
#   -10 platform-base (namespaces/PSS, quotas, default-deny, StorageClass)
#    -9 argocd (self-managed)          -8 aws-load-balancer-controller, metrics-server
#    -7 external-secrets               -6 karpenter
#    -5 kube-prometheus-stack (CRDs)   -4 ingress-nginx, external-dns, keda, argo-rollouts, eck-operator,
#                                         kyverno, velero, strimzi (dev)
#    -3 platform-config (ClusterSecretStores, NodePools, ALB Ingress, ES/Kibana, Kafka, schedules,
#       dashboards, rules, Kyverno policies)
#    -2 postgresql/redis (dev), kafka-exporter (staging/prod)
#    -1 fluent-bit, jaeger, opentelemetry-collector, kubecost, blackbox-exporter
#     0 services ApplicationSet (services-appset.yaml)
# Lines marked "tf-output: <name>" must match the Terraform output of the same name for this env.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/Ganga888/shopverse.git
    targetRevision: main
    path: gitops/envs/staging/platform/base
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-9"
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 7.8.2
    helm:
      releaseName: argocd
      valuesObject:
        global:
          domain: argocd.staging.ganga888.in
        crds:
          keep: true
        configs:
          params:
            server.insecure: true            # TLS terminates at the ALB, nginx -> argocd-server over HTTP
            application.namespaces: argocd
          cm:
            url: https://argocd.staging.ganga888.in
            application.resourceTrackingMethod: annotation
            admin.enabled: true              # disable once SSO below is configured
            exec.enabled: false
            statusbadge.enabled: true
            timeout.reconciliation: 180s
            # --- SSO placeholder (OIDC). Create the client in your IdP, store the secret in AWS
            # Secrets Manager and sync it with an ExternalSecret into argocd-secret (key oidc.sso.clientSecret).
            # oidc.config: |
            #   name: SSO
            #   issuer: https://login.example.com/
            #   clientID: argocd-staging
            #   clientSecret: $oidc.sso.clientSecret
            #   requestedScopes: ["openid", "profile", "email", "groups"]
            resource.exclusions: |
              - apiGroups: ["cilium.io"]
                kinds: ["CiliumIdentity"]
                clusters: ["*"]
            # Application health is required for sync-wave ordering of app-of-apps.
            resource.customizations.health.argoproj.io_Application: |
              hs = {}
              hs.status = "Progressing"
              hs.message = ""
              if obj.status ~= nil then
                if obj.status.health ~= nil then
                  hs.status = obj.status.health.status
                  if obj.status.health.message ~= nil then
                    hs.message = obj.status.health.message
                  end
                end
              end
              return hs
            # ESO adds defaulted fields; ignore them to avoid perpetual OutOfSync.
            resource.customizations.ignoreDifferences.external-secrets.io_ExternalSecret: |
              jqPathExpressions:
                - .spec.data[]?.remoteRef.conversionStrategy
                - .spec.data[]?.remoteRef.decodingStrategy
                - .spec.data[]?.remoteRef.metadataPolicy
                - .spec.dataFrom[]?.extract.conversionStrategy
                - .spec.dataFrom[]?.extract.decodingStrategy
                - .spec.dataFrom[]?.extract.metadataPolicy
          rbac:
            policy.default: role:readonly
            policy.csv: |
              g, platform-team, role:admin
              p, role:developer, applications, get, */*, allow
              p, role:developer, applications, sync, shopverse/*, allow
              p, role:developer, applications, action/argoproj.io/Rollout/*, shopverse/*, allow
              g, developers, role:developer
          repositories:
            bitnami-oci:
              type: helm
              name: bitnamicharts
              url: registry-1.docker.io/bitnamicharts
              enableOCI: "true"
            karpenter-oci:
              type: helm
              name: karpenter
              url: public.ecr.aws/karpenter
              enableOCI: "true"
        controller:
          replicas: 1
          metrics: { enabled: true, serviceMonitor: { enabled: true } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }
        server:
          replicas: 2
          metrics: { enabled: true, serviceMonitor: { enabled: true } }
          ingress:
            enabled: true
            ingressClassName: nginx
            hostname: argocd.staging.ganga888.in
            annotations:
              nginx.ingress.kubernetes.io/backend-protocol: HTTP
        repoServer:
          replicas: 2
          metrics: { enabled: true, serviceMonitor: { enabled: true } }
        applicationSet:
          replicas: 1
          metrics: { enabled: true, serviceMonitor: { enabled: true } }
        redis-ha:
          enabled: false
        dex:
          enabled: false
        notifications:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # never let ArgoCD prune itself
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.13.0
    helm:
      releaseName: aws-load-balancer-controller
      valuesObject:
        clusterName: shopverse-staging
        region: ap-south-1
        vpcId: vpc-0staging000000000   # tf-output: vpc_id (nodes use IMDS hop limit 1, so no IMDS discovery)
        replicaCount: 2
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::786896018375:role/shopverse-staging-aws-load-balancer-controller
        enableServiceMutatorWebhook: false
        defaultTags:
          Project: shopverse
          Environment: staging
          Owner: platform-team
          CostCenter: shopverse
          ManagedBy: terraform
        podDisruptionBudget: { maxUnavailable: 1 }
        serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
        resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    targetRevision: 3.12.2
    helm:
      releaseName: metrics-server
      valuesObject:
        replicas: 2
        podDisruptionBudget: { enabled: true, minAvailable: 1 }
        args:
          - --kubelet-preferred-address-types=InternalIP
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 256Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
spec:
  project: platform
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.18.2
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        replicaCount: 2
        leaderElect: true
        serviceAccount:
          name: external-secrets
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::786896018375:role/shopverse-staging-external-secrets
        serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
        resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
        webhook:
          replicaCount: 2
          serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
        certController:
          serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  project: platform
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: 1.4.0
    helm:
      releaseName: karpenter
      valuesObject:
        settings:
          clusterName: shopverse-staging
          interruptionQueue: shopverse-staging-karpenter   # tf-output: karpenter_interruption_queue
          featureGates:
            spotToSpotConsolidation: true
        serviceAccount:
          name: karpenter
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::786896018375:role/shopverse-staging-karpenter
        replicas: 2
        # Runs on the managed system node group (chart default affinity keeps it off Karpenter nodes)
        controller:
          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { memory: 1Gi } }
        serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
        podDisruptionBudget: { name: karpenter, maxUnavailable: 1 }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 70.4.2
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        fullnameOverride: kube-prometheus-stack
        crds: { enabled: true }
        defaultRules:
          create: true
          rules:
            etcd: false
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            kubeProxy: false
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        prometheus:
          prometheusSpec:
            replicas: 1
            retention: 7d
            retentionSize: 45GB
            scrapeInterval: 30s
            evaluationInterval: 30s
            externalLabels:
              cluster: shopverse-staging
              env: staging
            # Select every ServiceMonitor/PodMonitor/PrometheusRule in the cluster.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false
            enableFeatures: [exemplar-storage]
            resources: { requests: { cpu: 500m, memory: 2Gi }, limits: { memory: 4Gi } }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 50Gi } }
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: ScheduleAnyway
                labelSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
        alertmanager:
          alertmanagerSpec:
            replicas: 2
            # Secret rendered by the ExternalSecret alertmanager-shopverse (platform-config): template
            # observability/alertmanager/alertmanager.yaml.tmpl + Slack/SMTP values from
            # AWS Secrets Manager shopverse/staging/monitoring/alertmanager.
            configSecret: alertmanager-shopverse
            # Notification templates (observability/alertmanager/shopverse.tmpl), mounted at
            # /etc/alertmanager/configmaps/alertmanager-templates/
            configMaps: [alertmanager-templates]
            externalUrl: https://grafana.staging.ganga888.in/alerting
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: [ReadWriteOnce]
                  resources: { requests: { storage: 5Gi } }
            resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
        grafana:
          replicas: 1
          admin:
            existingSecret: grafana-admin       # ESO Password generator (platform-config)
            userKey: admin-user
            passwordKey: admin-password
          serviceAccount:
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::786896018375:role/shopverse-staging-grafana   # CloudWatch (RDS) read
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts: [grafana.staging.ganga888.in]
            path: /
          grafana.ini:
            server:
              root_url: https://grafana.staging.ganga888.in
            analytics: { check_for_updates: false, reporting_enabled: false }
            auth.anonymous: { enabled: false }
            users: { allow_sign_up: false }
          persistence: { enabled: false }       # dashboards and datasources are code
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
              labelValue: "1"
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              provider: { foldersFromFilesStructure: true }
            datasources:
              enabled: true
          additionalDataSources:
            - name: CloudWatch
              uid: cloudwatch
              type: cloudwatch
              jsonData: { authType: default, defaultRegion: ap-south-1 }
            - name: Elasticsearch-logs
              uid: es-logs
              type: elasticsearch
              url: https://shopverse-es-http.logging.svc:9200
              basicAuth: true
              basicAuthUser: grafana
              jsonData:
                index: logs-k8s-*
                timeField: "@timestamp"
                tlsAuthWithCACert: true
                logMessageField: message
                logLevelField: level
                dataLinks:
                  - field: trace_id
                    datasourceUid: jaeger
                    url: "$${__value.raw}"
              secureJsonData:
                basicAuthPassword: $__file{/etc/secrets/es-user-grafana/password}
                tlsCACert: $__file{/etc/secrets/es-user-grafana/ca.crt}
            - name: Jaeger
              uid: jaeger
              type: jaeger
              url: http://jaeger-query.tracing.svc:80
              jsonData:
                tracesToLogsV2:
                  datasourceUid: es-logs
                  spanStartTimeShift: "-5m"
                  spanEndTimeShift: "5m"
                  filterByTraceID: true
                  customQuery: true
                  query: 'trace_id:"$${__trace.traceId}"'
                tracesToMetrics:
                  datasourceUid: prometheus
          extraSecretMounts:
            - name: es-user-grafana
              secretName: es-user-grafana
              mountPath: /etc/secrets/es-user-grafana
              readOnly: true
        prometheus-node-exporter:
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 64Mi } }
        kube-state-metrics:
          metricLabelsAllowlist:
            - pods=[app.kubernetes.io/name,app.kubernetes.io/version]
            - deployments=[app.kubernetes.io/name]
            - nodes=[karpenter.sh/capacity-type,node.kubernetes.io/instance-type,topology.kubernetes.io/zone]
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.12.1
    helm:
      releaseName: ingress-nginx
      valuesObject:
        controller:
          ingressClassResource: { name: nginx, default: true }
          # ClusterIP only: the internet-facing ALB (alb Ingress in platform-config) targets these pods by IP.
          service:
            type: ClusterIP
          publishService: { enabled: false }
          replicaCount: 2
          autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 6, targetCPUUtilizationPercentage: 70 }
          minAvailable: 1
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels: { app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/component: controller }
          config:
            use-forwarded-headers: "true"
            compute-full-forwarded-for: "true"
            proxy-real-ip-cidr: 10.20.0.0/16   # tf-output: vpc_cidr
            enable-opentelemetry: "true"
            otlp-collector-host: otel-collector.tracing.svc
            otlp-collector-port: "4317"
            otel-service-name: ingress-nginx
            opentelemetry-trust-incoming-span: "true"
            otel-sampler: AlwaysOn
            log-format-escape-json: "true"
            log-format-upstream: '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$req_id","trace_id":"$opentelemetry_trace_id","method":"$request_method","host":"$host","uri":"$uri","status":$status,"bytes_sent":$bytes_sent,"request_time":$request_time,"upstream":"$proxy_upstream_name","upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time","user_agent":"$http_user_agent"}'
            hsts: "false"            # set by CloudFront/ALB
            server-tokens: "false"
            enable-underscores-in-headers: "false"
          metrics:
            enabled: true
            serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { memory: 512Mi } }
          admissionWebhooks: { enabled: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.16.1
    helm:
      releaseName: external-dns
      valuesObject:
        provider: { name: aws }
        env:
          - { name: AWS_DEFAULT_REGION, value: ap-south-1 }
        serviceAccount:
          name: external-dns
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::786896018375:role/shopverse-staging-external-dns
        sources: [ingress]
        domainFilters: [ganga888.in]
        # One hosted zone shared by all envs: ownership via TXT owner id, so each env only touches its records.
        policy: sync
        registry: txt
        txtOwnerId: shopverse-staging
        txtPrefix: "extdns-%{record_type}-"
        interval: 1m
        extraArgs:
          - --ingress-class=alb            # only the ALB Ingress (nginx Ingresses have no public address)
          - --aws-zone-type=public
          - --aws-batch-change-size=100
        serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
        resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 128Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
apiVersion: argoproj.io/v1alpha1
