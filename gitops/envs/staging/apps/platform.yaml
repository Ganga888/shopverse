apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://jaegertracing.github.io/helm-charts
    chart: jaeger
    targetRevision: 3.4.1
    helm:
      releaseName: jaeger
      valuesObject:
        provisionDataStore: { cassandra: false, elasticsearch: false, kafka: false }
        allInOne: { enabled: false }
        agent: { enabled: false }
        storage:
          type: elasticsearch
          elasticsearch:
            scheme: https
            host: shopverse-es-http.logging.svc
            port: 9200
            user: jaeger
            usePassword: true
            existingSecret: es-user-jaeger          # copied from logging ns by ExternalSecret (platform-config)
            existingSecretKey: password
            tls:
              enabled: true
              secretName: es-http-ca
              mountPath: /es-tls/ca.crt
              subPath: ca.crt
              ca: /es-tls/ca.crt
            extraEnv:
              - { name: ES_INDEX_PREFIX, value: shopverse }
              - { name: ES_NUM_REPLICAS, value: "0" }
              - { name: ES_NUM_SHARDS, value: "1" }
        collector:
          replicaCount: 2
          service:
            otlp:
              grpc: { name: otlp-grpc, port: 4317 }
              http: { name: otlp-http, port: 4318 }
          serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
        query:
          replicaCount: 1
          serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts: [jaeger.staging.ganga888.in]
            annotations:
              # Jaeger UI has no auth: basic-auth from secret ops-basic-auth (ESO Password generator)
              nginx.ingress.kubernetes.io/auth-type: basic
              nginx.ingress.kubernetes.io/auth-secret: ops-basic-auth
              nginx.ingress.kubernetes.io/auth-realm: "ShopVerse ops"
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
        esIndexCleaner:
          enabled: true
          numberOfDays: 14
          schedule: "55 23 * * *"
          extraEnv:
            - { name: INDEX_PREFIX, value: shopverse }
        esRollover: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
