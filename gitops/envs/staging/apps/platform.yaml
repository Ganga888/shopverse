apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-blackbox-exporter
    targetRevision: 9.4.0
    helm:
      releaseName: blackbox-exporter
      valuesObject:
        fullnameOverride: blackbox-exporter     # Probe CRs use blackbox-exporter.monitoring.svc:9115
        config:
          modules:
            http_2xx:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                valid_status_codes: [200]
                fail_if_not_ssl: true
            # tool UIs behind auth answer 401 - still proves DNS + ALB + WAF + TLS + nginx path
            http_2xx_or_auth:
              prober: http
              timeout: 10s
              http:
                preferred_ip_protocol: ip4
                valid_status_codes: [200, 401, 302]
                fail_if_not_ssl: true
                no_follow_redirects: true
        resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
---
# ---------------- staging/prod: consumer-lag metrics for Amazon MSK ----------------
# Exposes kafka_consumergroup_lag (same metric Strimzi's kafka-exporter provides in dev) for the
# Kafka lag dashboard and alerts. KEDA reads lag directly from the brokers.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-kafka-exporter
    targetRevision: 2.12.1
    helm:
      releaseName: kafka-exporter
      valuesObject:
        kafkaServer:
          - b-1.shopverse-staging.abc123.c2.kafka.ap-south-1.amazonaws.com:9096   # tf-output: msk_bootstrap_brokers (SASL/SCRAM)
          - b-2.shopverse-staging.abc123.c2.kafka.ap-south-1.amazonaws.com:9096   # tf-output: msk_bootstrap_brokers (SASL/SCRAM)
        tls:
          enabled: true
          insecureSkipTlsVerify: false
        sasl:
          enabled: true
          handshake: true
          scram:
            enabled: true
            mechanism: scram-sha512
            secretName: kafka-exporter-scram   # ExternalSecret in platform/monitoring
        prometheus:
          serviceMonitor:
            enabled: true
            namespace: monitoring
            additionalLabels: { release: kube-prometheus-stack }
            interval: 30s
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: [ALL] }
          seccompProfile: { type: RuntimeDefault }
        resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { memory: 128Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
