    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 8.1.0
    helm:
      releaseName: velero
      valuesObject:
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.11.0
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - { mountPath: /target, name: plugins }
        credentials:
          useSecret: false                   # IRSA
        serviceAccount:
          server:
            name: velero
            annotations:
              eks.amazonaws.com/role-arn: arn:aws:iam::786896018375:role/shopverse-staging-velero
        configuration:
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: shopverse-staging-velero
              default: true
              config: { region: ap-south-1 }
          volumeSnapshotLocation:
            - name: default
              provider: aws
              config: { region: ap-south-1 }
          defaultVolumesToFsBackup: false
        deployNodeAgent: false               # EBS snapshots only; no file-system backup
        snapshotsEnabled: true
        schedules: {}                        # Schedules live in gitops/envs/staging/platform/velero
        metrics:
          enabled: true
          serviceMonitor: { enabled: true, additionalLabels: { release: kube-prometheus-stack } }
          prometheusRule:
            enabled: true
            additionalLabels: { release: kube-prometheus-stack }
            spec:
              - alert: VeleroBackupFailed
                expr: increase(velero_backup_failure_total{schedule!=""}[1h]) > 0
                labels: { severity: critical }
                annotations:
                  summary: "Velero backup for schedule {{ $labels.schedule }} failed"
                  runbook_url: https://github.com/shopverse/aws-microservices/blob/main/docs/runbooks/dr-restore.md
              - alert: VeleroNoRecentBackup
                expr: time() - velero_backup_last_successful_timestamp{schedule="daily-full"} > 90000
                labels: { severity: warning }
                annotations:
                  summary: "No successful daily-full Velero backup in 25h"
        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 512Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ServerSideApply=true, CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
