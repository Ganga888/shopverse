apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opentelemetry-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.120.0
    helm:
      releaseName: opentelemetry-collector
      valuesObject:
        # Service name must be otel-collector.tracing (contract: OTEL_EXPORTER_OTLP_ENDPOINT)
        fullnameOverride: otel-collector
        mode: deployment
        replicaCount: 2
        image:
          repository: otel/opentelemetry-collector-contrib
        presets:
          kubernetesAttributes: { enabled: true, extractAllPodLabels: false }
        ports:
          metrics: { enabled: true }
          jaeger-compact: { enabled: false }
          jaeger-thrift: { enabled: false }
          jaeger-grpc: { enabled: false }
          zipkin: { enabled: false }
          promexporter:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP
        serviceMonitor:
          enabled: true
          extraLabels: { release: kube-prometheus-stack }
          metricsEndpoints:
            - port: metrics
            - port: promexporter
        podDisruptionBudget: { enabled: true, minAvailable: 1 }
        resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
        config:
          receivers:
            jaeger: null
            zipkin: null
            prometheus: null
            otlp:
              protocols:
                grpc: { endpoint: "${env:MY_POD_IP}:4317" }
                http: { endpoint: "${env:MY_POD_IP}:4318" }
          processors:
            memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25 }
            batch: { send_batch_size: 1024, timeout: 5s }
            resource:
              attributes:
                - { key: deployment.environment, value: staging, action: upsert }
                - { key: k8s.cluster.name, value: shopverse-staging, action: upsert }
          connectors:
            spanmetrics:
              namespace: traces.spanmetrics
              histogram:
                explicit:
                  buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
              dimensions:
                - name: http.request.method
                - name: http.response.status_code
                - name: http.route
                - name: messaging.destination.name
              exemplars: { enabled: true }
              metrics_flush_interval: 15s
          exporters:
            otlp/jaeger:
              endpoint: jaeger-collector.tracing.svc:4317
              tls: { insecure: true }
              sending_queue: { enabled: true, num_consumers: 4, queue_size: 5000 }
              retry_on_failure: { enabled: true }
            prometheus:
              endpoint: "${env:MY_POD_IP}:8889"
              resource_to_telemetry_conversion: { enabled: true }
              enable_open_metrics: true
          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [memory_limiter, k8sattributes, resource, batch]
                exporters: [otlp/jaeger, spanmetrics]
              metrics/spanmetrics:
                receivers: [spanmetrics]
                processors: [memory_limiter, batch]
                exporters: [prometheus]
              metrics: null
              logs: null
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 5m } }
