# media-service (staging) - values for charts/microservice. Release name == media-service, namespace shop.
# image.tag is bumped by the promote workflow (.github) - do not edit by hand outside a PR.
# Datastores, topics, secrets and IRSA follow docs/CONTRACT.md - keep them in sync with the contract.
global:
  env: staging
  domain: staging.ganga888.in
  awsAccountId: '786896018375'
  awsRegion: ap-south-1
image:
  repository: 786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/media-service
  tag: bootstrap
replicaCount: 2
logLevel: info
nodeEnv: production
resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi
ingress:
  enabled: true
  path: /api/v1/media
serviceAccount:
  irsa:
    enabled: true
    roleArn: arn:aws:iam::786896018375:role/shopverse-staging-media-service
env:
  NODE_OPTIONS: --max-old-space-size=288
  S3_BUCKET: shopverse-staging-media
  CDN_BASE_URL: https://cdn.staging.ganga888.in
  PRESIGNED_URL_TTL_SECONDS: '900'
externalSecrets:
  enabled: false
  items: []
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpread:
  zoneWhenUnsatisfiable: ScheduleAnyway
prometheusRule:
  severity: warning
networkPolicy:
  callers: []
  egressToServices: []
  egress:
    postgres: false
    redis: false
    kafka: false
