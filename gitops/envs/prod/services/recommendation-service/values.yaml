# recommendation-service (prod) - values for charts/microservice. Release name == recommendation-service, namespace shop.
# image.tag is bumped by the promote workflow (.github) - do not edit by hand outside a PR.
# Datastores, topics, secrets and IRSA follow docs/CONTRACT.md - keep them in sync with the contract.
# Kafka: MSK SASL/SCRAM on 9096; brokers + credentials come from Secrets Manager (AmazonMSK_shopverse_prod_app).
global:
  env: prod
  domain: ganga888.in
  awsAccountId: '786896018375'
  awsRegion: ap-south-1
image:
  repository: 786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/recommendation-service
  tag: bootstrap
replicaCount: 3
logLevel: info
nodeEnv: production
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
ingress:
  enabled: true
  path: /api/v1/recommendations
serviceAccount:
  irsa:
    enabled: false
env:
  NODE_OPTIONS: --max-old-space-size=384
  KAFKA_SSL: 'true'
  KAFKA_CLIENT_ID: recommendation-service
  KAFKA_GROUP_ID: recommendation-service
  KAFKA_SASL_MECHANISM: scram-sha-512
externalSecrets:
  items:
  - name: redis
    remoteKey: shopverse/prod/redis
    keys:
      REDIS_URL: url
  - name: kafka
    remoteKey: AmazonMSK_shopverse_prod_app
    keys:
      KAFKA_BROKERS: brokers
      KAFKA_SASL_USERNAME: username
      KAFKA_SASL_PASSWORD: password
  enabled: true
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 2
topologySpread:
  zoneWhenUnsatisfiable: DoNotSchedule
prometheusRule:
  severity: critical
networkPolicy:
  callers: []
  egressToServices:
  - catalog-service
  egress:
    postgres: false
    redis: true
    kafka: true
