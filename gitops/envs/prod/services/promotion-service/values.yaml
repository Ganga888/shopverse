# promotion-service (prod) - values for charts/microservice. Release name == promotion-service, namespace shop.
# image.tag is bumped by the promote workflow (.github) - do not edit by hand outside a PR.
# Datastores, topics, secrets and IRSA follow docs/CONTRACT.md - keep them in sync with the contract.
global:
  env: prod
  domain: ganga888.in
  awsAccountId: '786896018375'
  awsRegion: ap-south-1
image:
  repository: 786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/promotion-service
  tag: bootstrap
replicaCount: 3
logLevel: info
nodeEnv: production
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi
ingress:
  enabled: true
  path: /api/v1/promotions
serviceAccount:
  irsa:
    enabled: false
env:
  NODE_OPTIONS: --max-old-space-size=384
  DB_SSL: 'true'
externalSecrets:
  items:
  - name: db
    remoteKey: shopverse/prod/rds/promotion-service
    keys:
      DB_HOST: host
      DB_PORT: port
      DB_NAME: dbname
      DB_USER: username
      DB_PASSWORD: password
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 2
topologySpread:
  zoneWhenUnsatisfiable: DoNotSchedule
prometheusRule:
  severity: critical
networkPolicy:
  callers:
  - cart-service
  - order-service
  egressToServices: []
  egress:
    postgres: true
    redis: false
    kafka: false
migration:
  enabled: true
