# Default StorageClass. The EBS CSI driver itself is the EKS managed add-on (Terraform).
# EKS >= 1.30 no longer marks gp2 as default, so gp3 is the only default class.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
  iops: "3000"
  throughput: "125"
  tagSpecification_1: "Project=shopverse"
  tagSpecification_2: "Environment=prod"
  tagSpecification_3: "Owner=platform-team"
  tagSpecification_4: "CostCenter=shopverse"
  tagSpecification_5: "ManagedBy=terraform"
