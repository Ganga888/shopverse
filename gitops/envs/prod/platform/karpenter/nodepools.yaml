# prod baseline: highest weight, so Karpenter fills on-demand capacity first (up to 48 vCPU),
# then overflows to the spot-preferred "general" pool => guaranteed on-demand floor + spot for bursts.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: on-demand-baseline
spec:
  weight: 50
  template:
    metadata:
      labels:
        shopverse.io/pool: on-demand-baseline
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      expireAfter: 720h
      terminationGracePeriod: 24h
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: kubernetes.io/os, operator: In, values: [linux] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [on-demand] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"] }
        - { key: karpenter.k8s.aws/instance-size, operator: NotIn, values: [nano, micro, small, metal] }
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
    budgets:
      - nodes: "10%"
      # no voluntary disruption during IST business peak (09:00-21:00 IST = 03:30-15:30 UTC)
      - nodes: "0"
        schedule: "30 3 * * *"
        duration: 12h
        reasons: [Underutilized, Drifted]
  limits:
    cpu: "48"
    memory: 192Gi
---
# general: spot preferred, on-demand fallback when spot capacity is unavailable
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  weight: 10
  template:
    metadata:
      labels:
        shopverse.io/pool: general
    spec:
      nodeClassRef: { group: karpenter.k8s.aws, kind: EC2NodeClass, name: default }
      expireAfter: 720h
      terminationGracePeriod: 24h
      requirements:
        - { key: kubernetes.io/arch, operator: In, values: [amd64] }
        - { key: kubernetes.io/os, operator: In, values: [linux] }
        - { key: karpenter.sh/capacity-type, operator: In, values: [spot, on-demand] }
        - { key: karpenter.k8s.aws/instance-category, operator: In, values: [c, m, r] }
        - { key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ["5"] }
        - { key: karpenter.k8s.aws/instance-size, operator: NotIn, values: [nano, micro, small, metal] }
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
    budgets:
      - nodes: "10%"
  limits:
    cpu: "200"
    memory: 800Gi
