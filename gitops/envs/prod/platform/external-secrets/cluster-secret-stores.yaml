# Contract: ClusterSecretStore "aws-secrets-manager" (AWS Secrets Manager, ap-south-1) using IRSA:
# the external-secrets controller SA is annotated with arn:aws:iam::786896018375:role/shopverse-prod-external-secrets,
# which may only read secretsmanager:GetSecretValue on arn:aws:secretsmanager:ap-south-1:786896018375:secret:shopverse/prod/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  conditions:
    - namespaces: [shop, monitoring, data, argocd, tracing, logging]
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
# Copies ECK-generated secrets (ES users + CA) from the logging namespace to tracing/monitoring.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-logging-reader
  namespace: external-secrets
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-logging-reader
  namespace: logging
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
    resourceNames: [es-user-jaeger, es-user-grafana, shopverse-es-http-certs-public]
  - apiGroups: ["authorization.k8s.io"]
    resources: [selfsubjectrulesreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-logging-reader
  namespace: logging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-logging-reader
subjects:
  - kind: ServiceAccount
    name: eso-logging-reader
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: logging-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  conditions:
    - namespaces: [tracing, monitoring]
  provider:
    kubernetes:
      remoteNamespace: logging
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: external-secrets
      auth:
        serviceAccount:
          name: eso-logging-reader
          namespace: external-secrets
