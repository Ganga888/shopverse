# In-cluster random credentials for platform-internal users (never leave the cluster).
# Generated once (refreshInterval "0" on the consuming ExternalSecrets).
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random-password
  namespace: logging
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random-password
  namespace: monitoring
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: random-password
  namespace: tracing
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
