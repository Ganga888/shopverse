# Grafana admin (random, in-cluster). Read it with:
#   kubectl -n monitoring get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: "0"
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: random-password }
---
# Basic auth in front of the Jaeger UI (jaeger.ganga888.in): user "ops".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-basic-auth
  namespace: tracing
spec:
  refreshInterval: "0"
  target:
    name: ops-basic-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth: '{{ htpasswd "ops" .password }}'
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef: { apiVersion: generators.external-secrets.io/v1alpha1, kind: Password, name: random-password }
---
# Alertmanager configuration = observability/alertmanager/alertmanager.yaml.tmpl rendered with the
# notifier credentials from AWS Secrets Manager shopverse/prod/monitoring/alertmanager
# (keys: slack_webhook_url, smtp_username, smtp_password, email_to).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-shopverse
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target:
    name: alertmanager-shopverse
    creationPolicy: Owner
    template:
      engineVersion: v2
      templateFrom:
        - configMap:
            name: alertmanager-config-template
            items:
              - key: alertmanager.yaml
                templateAs: Values
  data:
    - secretKey: slack_webhook_url
      remoteRef: { key: shopverse/prod/monitoring/alertmanager, property: slack_webhook_url }
    - secretKey: smtp_username
      remoteRef: { key: shopverse/prod/monitoring/alertmanager, property: smtp_username }
    - secretKey: smtp_password
      remoteRef: { key: shopverse/prod/monitoring/alertmanager, property: smtp_password }
    - secretKey: email_to
      remoteRef: { key: shopverse/prod/monitoring/alertmanager, property: email_to }
