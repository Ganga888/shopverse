# ShopVerse Fluent Bit parsers (source of truth). Mirrored into the fluent-bit Application
# (gitops/envs/<env>/apps/platform.yaml -> config.customParsers); keep both in sync.
#
# Container runtime framing (containerd CRI) is handled by the built-in multiline parser "cri";
# the JSON payload written by the services is decoded by the kubernetes filter (Merge_Log On),
# which uses the parser named in the pod annotation fluentbit.io/parser (default: JSON auto-detect).

# Node.js services log with pino: {"level":30,"time":1727950000000,"msg":"...","service":"order-service",
#   "trace_id":"4bf92f3577b34da6a3ce929d0e0e4736","span_id":"00f067aa0ba902b7","correlationId":"<orderId>"}
[PARSER]
    Name        pino_json
    Format      json
    Time_Key    time
    Time_Format %s%L
    Time_Keep   On

# Services configured with an ISO timestamp (pino.stdTimeFunctions.isoTime)
[PARSER]
    Name        shopverse_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# ingress-nginx access log (log-format-upstream is JSON, includes trace_id = $opentelemetry_trace_id)
[PARSER]
    Name        nginx_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Time_Keep   On

# Fallback for plain-text platform components (klog style: I1003 14:09:00.123456  1 file.go:42] msg)
[PARSER]
    Name        klog
    Format      regex
    Regex       ^(?<level>[IWEF])(?<time>\d{4} \d{2}:\d{2}:\d{2}\.\d{6})\s+(?<pid>\d+)\s+(?<source>[^\]]+)\]\s+(?<message>.*)$
    Time_Key    time
    Time_Format %m%d %H:%M:%S.%L
    Time_Keep   On
