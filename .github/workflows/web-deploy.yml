# Build the web SPA once and publish it to s3://shopverse-<env>-web behind CloudFront.
# The SPA calls the API through the same CloudFront origin (/api/*), so the
# build is environment-agnostic and the same artifact is promoted.
name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
        default: dev

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  NODE_VERSION: "22"
  WEB_DIR: web

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - id: env
        run: echo "environment=${{ inputs.environment || 'dev' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Install, test, build
        working-directory: ${{ env.WEB_DIR }}
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
          npm run build
          if [ -d dist ]; then out=dist; elif [ -d build ]; then out=build; else echo "::error::no dist/ or build/ output"; exit 1; fi
          test -f "$out/index.html" || { echo "::error::$out/index.html missing"; exit 1; }
          mv "$out" "$GITHUB_WORKSPACE/web-dist"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-dist
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ needs.build.outputs.environment }}
    concurrency:
      group: web-deploy-${{ needs.build.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.build.outputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: web-dist

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/shopverse-gha-web-deploy
          role-session-name: gha-web-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve bucket + distribution
        id: target
        run: |
          set -euo pipefail
          if [ "$ENVIRONMENT" = "prod" ]; then domain="ganga888.in"; else domain="$ENVIRONMENT.ganga888.in"; fi
          dist=$(aws cloudfront list-distributions \
                   --query "DistributionList.Items[?Aliases.Items && contains(Aliases.Items, '$domain')].Id | [0]" --output text)
          [ -n "$dist" ] && [ "$dist" != "None" ] || { echo "::error::no CloudFront distribution with alias $domain"; exit 1; }
          echo "bucket=shopverse-$ENVIRONMENT-web" >> "$GITHUB_OUTPUT"
          echo "distribution=$dist" >> "$GITHUB_OUTPUT"
          echo "url=https://$domain" >> "$GITHUB_OUTPUT"

      - name: Sync to S3
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        run: |
          set -euo pipefail
          # Content-hashed assets: cache for a year.
          aws s3 sync web-dist "s3://$BUCKET" --delete \
            --exclude "index.html" --exclude "*.json" --exclude "robots.txt" \
            --cache-control "public,max-age=31536000,immutable"
          # Entry points: always revalidate.
          aws s3 sync web-dist "s3://$BUCKET" \
            --exclude "*" --include "index.html" --include "*.json" --include "robots.txt" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        env:
          DIST: ${{ steps.target.outputs.distribution }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/index.html" "/" "/*.json" --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DIST" --id "$id"
          echo "Deployed ${{ github.sha }} to ${{ steps.target.outputs.url }} (invalidation $id)" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.target.outputs.url }}/")
          echo "GET / -> $code"
          [ "$code" = "200" ]
