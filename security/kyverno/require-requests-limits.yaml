apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-requests-limits
  annotations:
    policies.kyverno.io/title: Require CPU/memory requests and limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requests drive scheduling, HPA utilisation, Karpenter bin-packing and Kubecost allocation;
      limits protect neighbours. Every container in the shop namespace must set both.
spec:
  background: true
  rules:
    - name: containers-have-requests-and-limits
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [shop]
      validate:
        failureAction: Enforce
        message: "Every container needs resources.requests.{cpu,memory} and resources.limits.{cpu,memory}."
        pattern:
          spec:
            =(initContainers):
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits: { cpu: "?*", memory: "?*" }
            containers:
              - resources:
                  requests: { cpu: "?*", memory: "?*" }
                  limits: { cpu: "?*", memory: "?*" }
