# Kyverno ClusterPolicies, pulled into every env by gitops/envs/<env>/platform/kustomization.yaml
# (dev patches signature + registry rules to Audit). Requires the kyverno Application (wave -4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
resources:
  - verify-image-signatures.yaml
  - require-requests-limits.yaml
  - disallow-latest-tag.yaml
  - require-non-root.yaml
  - require-probes.yaml
  - restrict-image-registries.yaml
