apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Workloads may only pull from the ShopVerse ECR registry and an allow-list of upstream registries
      / Docker Hub organisations used by the platform charts. Adding a registry is a reviewed PR here.
spec:
  background: true
  rules:
    - name: allowed-registries
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system, kyverno]
      validate:
        failureAction: Enforce
        message: >-
          Image registry not allowed. Use 786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/* or an
          approved upstream (see security/kyverno/restrict-image-registries.yaml).
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "786896018375.dkr.ecr.ap-south-1.amazonaws.com/* | public.ecr.aws/* | registry.k8s.io/* | quay.io/* | ghcr.io/* | reg.kyverno.io/* | docker.elastic.co/* | cr.fluentbit.io/* | gcr.io/kubecost1/* | cr.l5d.io/* | docker.io/bitnamilegacy/* | bitnamilegacy/* | docker.io/grafana/* | grafana/* | otel/* | docker.io/otel/* | jaegertracing/* | docker.io/jaegertracing/* | velero/* | docker.io/velero/* | curlimages/* | docker.io/curlimages/* | danielqsj/* | docker.io/danielqsj/*"
            =(initContainers):
              - image: "786896018375.dkr.ecr.ap-south-1.amazonaws.com/* | public.ecr.aws/* | registry.k8s.io/* | quay.io/* | ghcr.io/* | reg.kyverno.io/* | docker.elastic.co/* | cr.fluentbit.io/* | gcr.io/kubecost1/* | cr.l5d.io/* | docker.io/bitnamilegacy/* | bitnamilegacy/* | docker.io/grafana/* | grafana/* | otel/* | docker.io/otel/* | jaegertracing/* | docker.io/jaegertracing/* | velero/* | docker.io/velero/* | curlimages/* | docker.io/curlimages/* | danielqsj/* | docker.io/danielqsj/*"
            containers:
              - image: "786896018375.dkr.ecr.ap-south-1.amazonaws.com/* | public.ecr.aws/* | registry.k8s.io/* | quay.io/* | ghcr.io/* | reg.kyverno.io/* | docker.elastic.co/* | cr.fluentbit.io/* | gcr.io/kubecost1/* | cr.l5d.io/* | docker.io/bitnamilegacy/* | bitnamilegacy/* | docker.io/grafana/* | grafana/* | otel/* | docker.io/otel/* | jaegertracing/* | docker.io/jaegertracing/* | velero/* | docker.io/velero/* | curlimages/* | docker.io/curlimages/* | danielqsj/* | docker.io/danielqsj/*"
    - name: shop-only-from-ecr
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [shop]
      validate:
        failureAction: Enforce
        message: "Pods in shop may only run ShopVerse images from ECR (786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/*)."
        pattern:
          spec:
            =(initContainers):
              - image: "786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/*"
            containers:
              - image: "786896018375.dkr.ecr.ap-south-1.amazonaws.com/shopverse/*"
