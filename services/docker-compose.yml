# Local development stack: Postgres 16, Redis 7, Kafka (KRaft), Jaeger, all 15 services and an nginx gateway
# that mimics ingress-nginx routing and serves ../web.  Usage: see README.md.
name: shopverse

x-service-env: &service-env
  NODE_ENV: development
  LOG_LEVEL: info
  PORT: "8080"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: shopverse
  DB_PASSWORD: shopverse
  DB_SSL: "false"
  REDIS_URL: redis://redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_SSL: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  JWT_ISSUER: http://localhost:8080/api/v1/auth
  JWKS_URL: http://auth-service:8080/api/v1/auth/.well-known/jwks.json
  AWS_REGION: ap-south-1
  SEED_SAMPLE_DATA: "true"
  SHUTDOWN_DELAY_MS: "0"
  CATALOG_URL: http://catalog-service:8080
  PROMOTION_URL: http://promotion-service:8080

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopverse
      POSTGRES_PASSWORD: shopverse
      POSTGRES_DB: shopverse
    volumes:
      - ./local/postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:9092
      PARTITIONS: "3"
      REPLICATION: "1"
    volumes:
      - ./scripts/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web:/usr/share/nginx/html:ro
    ports: ["8080:8080"]
    depends_on: [auth-service, catalog-service, cart-service, order-service]

  auth-service:
    <<: *service
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: shopverse/auth-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: auth-service
      DB_NAME: auth
      ADMIN_EMAILS: admin@shopverse.local
    ports: ["8081:8080"]

  user-service:
    <<: *service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    image: shopverse/user-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: user-service
      DB_NAME: users
    ports: ["8082:8080"]

  catalog-service:
    <<: *service
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    image: shopverse/catalog-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: catalog-service
      DB_NAME: catalog
    ports: ["8083:8080"]

  search-service:
    <<: *service
    build:
      context: .
      dockerfile: search-service/Dockerfile
    image: shopverse/search-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: search-service
      DB_NAME: search
    ports: ["8084:8080"]

  inventory-service:
    <<: *service
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    image: shopverse/inventory-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: inventory-service
      DB_NAME: inventory
    ports: ["8085:8080"]

  cart-service:
    <<: *service
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    image: shopverse/cart-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: cart-service
    ports: ["8086:8080"]

  order-service:
    <<: *service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    image: shopverse/order-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: order-service
      DB_NAME: orders
    ports: ["8087:8080"]

  payment-service:
    <<: *service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: shopverse/payment-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: payment-service
      DB_NAME: payments
      PAYMENT_GATEWAY_API_KEY: local-dev-key
    ports: ["8088:8080"]

  shipping-service:
    <<: *service
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    image: shopverse/shipping-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: shipping-service
      DB_NAME: shipping
    ports: ["8089:8080"]

  notification-service:
    <<: *service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    image: shopverse/notification-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: notification-service
      SES_ENABLED: "false"
    ports: ["8090:8080"]

  review-service:
    <<: *service
    build:
      context: .
      dockerfile: review-service/Dockerfile
    image: shopverse/review-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: review-service
      DB_NAME: reviews
    ports: ["8091:8080"]

  promotion-service:
    <<: *service
    build:
      context: .
      dockerfile: promotion-service/Dockerfile
    image: shopverse/promotion-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: promotion-service
      DB_NAME: promotions
    ports: ["8092:8080"]

  recommendation-service:
    <<: *service
    build:
      context: .
      dockerfile: recommendation-service/Dockerfile
    image: shopverse/recommendation-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: recommendation-service
    ports: ["8093:8080"]

  media-service:
    <<: *service
    build:
      context: .
      dockerfile: media-service/Dockerfile
    image: shopverse/media-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: media-service
      S3_BUCKET: shopverse-dev-media
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      CDN_BASE_URL: http://localhost:8080/cdn
    ports: ["8094:8080"]

  audit-service:
    <<: *service
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    image: shopverse/audit-service:local
    environment:
      <<: *service-env
      SERVICE_NAME: audit-service
      DB_NAME: audit
      S3_BUCKET: shopverse-dev-audit
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ARCHIVE_ENABLED: "false"  # no S3 locally; set true with real credentials or an S3-compatible S3_ENDPOINT
    ports: ["8095:8080"]

volumes:
  pgdata:
