# Local stand-in for ingress-nginx: /api/v1/<route> -> <service>:8080, everything else -> ../web (SPA).
server {
  listen 8080;
  resolver 127.0.0.11 valid=10s;
  root /usr/share/nginx/html;
  client_max_body_size 2m;

  location = /api/v1/auth/.well-known/jwks.json { set $u auth-service;  proxy_pass http://$u:8080; }
  location /api/v1/auth/            { set $u auth-service;           proxy_pass http://$u:8080; }
  location /api/v1/users            { set $u user-service;           proxy_pass http://$u:8080; }
  location /api/v1/products         { set $u catalog-service;        proxy_pass http://$u:8080; }
  location /api/v1/search           { set $u search-service;         proxy_pass http://$u:8080; }
  location /api/v1/inventory        { set $u inventory-service;      proxy_pass http://$u:8080; }
  location /api/v1/cart             { set $u cart-service;           proxy_pass http://$u:8080; }
  location /api/v1/orders           { set $u order-service;          proxy_pass http://$u:8080; }
  location /api/v1/payments         { set $u payment-service;        proxy_pass http://$u:8080; }
  location /api/v1/shipping         { set $u shipping-service;       proxy_pass http://$u:8080; }
  location /api/v1/reviews          { set $u review-service;         proxy_pass http://$u:8080; }
  location /api/v1/promotions       { set $u promotion-service;      proxy_pass http://$u:8080; }
  location /api/v1/recommendations  { set $u recommendation-service; proxy_pass http://$u:8080; }
  location /api/v1/media            { set $u media-service;          proxy_pass http://$u:8080; }
  location /api/v1/audit            { set $u audit-service;          proxy_pass http://$u:8080; }
  location /api/v1/notifications {
    set $u notification-service;
    proxy_pass http://$u:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location / { try_files $uri $uri/ /index.html; }
}
