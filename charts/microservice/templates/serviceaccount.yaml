{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.serviceAccountName" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.irsa.enabled .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.serviceAccount.irsa.enabled }}
    eks.amazonaws.com/role-arn: {{ include "microservice.irsaRoleArn" . | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
