{{- if .Values.externalSecrets.enabled }}
{{- range $item := .Values.externalSecrets.items }}
---
apiVersion: {{ $.Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "microservice.name" $ }}-{{ $item.name }}
  labels:
    {{- include "microservice.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    shopverse.io/remote-key: {{ $item.remoteKey | quote }}
spec:
  refreshInterval: {{ $item.refreshInterval | default $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.storeName }}
    kind: {{ $.Values.externalSecrets.storeKind }}
  target:
    name: {{ include "microservice.name" $ }}-{{ $item.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        labels:
          {{- include "microservice.selectorLabels" $ | nindent 10 }}
          app.kubernetes.io/part-of: {{ $.Values.global.partOf }}
  data:
    {{- range $envVar, $property := $item.keys }}
    - secretKey: {{ $envVar }}
      remoteRef:
        key: {{ $item.remoteKey }}
        property: {{ $property }}
    {{- end }}
{{- end }}
{{- end }}
