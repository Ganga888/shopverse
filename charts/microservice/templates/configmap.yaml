apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservice.name" . }}-env
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  {{- range $k, $v := (include "microservice.envMap" . | fromYaml) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
